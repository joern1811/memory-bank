version: 2

project_name: memory-bank

before:
  hooks:
    - go mod tidy
    - go test ./...
    - ./scripts/completions.sh

builds:
  - id: memory-bank
    main: ./cmd/memory-bank
    binary: memory-bank
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/joern1811/memory-bank/internal/infra/cli.version={{.Version}}
      - -X github.com/joern1811/memory-bank/internal/infra/cli.commit={{.Commit}}
      - -X github.com/joern1811/memory-bank/internal/infra/cli.date={{.Date}}

archives:
  - id: memory-bank
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - completions/*
      - README.md
      - LICENSE
      - CHANGELOG.md
    wrap_in_directory: false

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^build:"
      - "^ci:"
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: Bug Fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Others
      order: 999

release:
  name_template: "{{.ProjectName}} v{{.Version}}"
  footer: |
    ## Installation
    
    ### Homebrew (macOS/Linux)
    ```bash
    brew install joern1811/tap/memory-bank
    ```
    
    ### Manual Installation
    Download the appropriate binary for your platform from the assets above.
    
    ## Usage
    
    ### MCP Server Mode (for Claude Code)
    ```bash
    ./memory-bank
    ```
    
    ### CLI Mode
    ```bash
    ./memory-bank --help
    ```

# Homebrew Formula (not Cask): CLI tools belong in Formulas per Homebrew guidance.
# The macOS Gatekeeper quarantine that the Cask removed is handled here in the
# install block via an on_macos xattr step. Shell completions are generated at
# build time by scripts/completions.sh and installed from the archive.
brews:
  - name: memory-bank
    ids:
      - memory-bank
    repository:
      owner: joern1811
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/joern1811/memory-bank"
    description: "Semantic memory management system for Claude Code using hexagonal architecture"
    license: "MIT"
    commit_author:
      name: "Jörn Dombrowski"
      email: "joern.dombrowski@gmail.com"
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    skip_upload: auto
    install: |-
      bin.install "memory-bank"
      on_macos do
        system "/usr/bin/xattr", "-dr", "com.apple.quarantine", "#{bin}/memory-bank"
      end
      bash_completion.install "completions/memory-bank.bash" => "memory-bank"
      zsh_completion.install "completions/memory-bank.zsh" => "_memory-bank"
      fish_completion.install "completions/memory-bank.fish"
    test: |
      system "#{bin}/memory-bank", "version"
    caveats: |
      Memory Bank works out-of-the-box with mock providers, but for enhanced performance,
      consider installing these optional services:

      For local embedding generation:
        brew install ollama
        ollama pull nomic-embed-text

      For vector search performance:
        # Option 1: Python package
        pip install chromadb

        # Option 2: uvx (no installation needed)
        uvx --from 'chromadb[server]' chroma run --host localhost --port 8000

        # Option 3: Docker
        docker run -p 8000:8000 chromadb/chroma

      Start Memory Bank MCP server:
        memory-bank